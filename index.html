    <!-- Instant Dark Mode Init: Eliminates any flash or delay on page load -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sadaqah_theme');
          // Default is strictly dark unless user explicitly chose light
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            if (saved !== 'dark') {
              localStorage.setItem('sadaqah_theme', 'dark');
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
